name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc

      - name: Tests
        run: npm test

      - name: Build (Chrome)
        run: npm run build:chrome

      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: better-intra-builds
          path: |
            dist-chrome
            dist-firefox
          retention-days: 14
