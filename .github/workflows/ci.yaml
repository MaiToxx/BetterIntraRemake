name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc

      - name: Tests
        run: npm test

      - name: Build (Chrome)
        run: npm run build:chrome

      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: better-intra-builds
          path: |
            dist-chrome
            dist-firefox
          retention-days: 14

      # Last on purpose: the budgets are checked once both builds exist, and
      # after the upload, so a failing budget still leaves you the artifacts to
      # inspect. Budgets live in scripts/measure-bundle.js (see docs/PERFORMANCE.md).
      - name: Bundle size budgets
        run: npm run check:size
      - name: No runtime import cycles
        run: npm run check:cycles
