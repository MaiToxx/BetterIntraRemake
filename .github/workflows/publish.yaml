name: Build and Publish

on:
  release:
    types: [published]

jobs:
  build-prerelease:
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Extension (Firefox)
        run: npm run build:firefox

      - name: web-ext build (Firefox)
        id: web-ext-build-ff
        uses: kewisch/action-web-ext@main
        with:
          cmd: build
          source: dist-firefox
          filename: "better-intra.xpi"

      - name: Build Extension (Chrome)
        run: npm run build:chrome

      - name: web-ext build (Chrome)
        id: web-ext-build-chrome
        uses: kewisch/action-web-ext@main
        with:
          cmd: build
          source: dist-chrome
          filename: "better-intra-chrome.zip"

      - name: Move Chrome artifact
        run: mv web-ext-artifacts/better-intra-chrome.zip .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            web-ext-artifacts/better-intra.xpi
            better-intra-chrome.zip

  build-and-sign:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Signing is optional: without AMO credentials the release still gets
      # the unsigned .xpi and the Chrome zip (usable as temporary add-on /
      # unpacked extension), and the in-extension update check still works.
      HAS_AMO: ${{ secrets.AMO_SIGN_KEY != '' && secrets.AMO_SIGN_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Extension (Firefox)
        run: npm run build:firefox

      - name: web-ext build (Firefox)
        id: web-ext-build-ff
        uses: kewisch/action-web-ext@v2
        with:
          cmd: build
          source: dist-firefox
          filename: "better-intra.xpi"

      - name: Build Extension (Chrome)
        run: npm run build:chrome

      - name: web-ext build (Chrome)
        id: web-ext-build-chrome
        uses: kewisch/action-web-ext@v2
        with:
          cmd: build
          source: dist-chrome
          filename: "better-intra-chrome.zip"

      - name: Move Chrome artifact
        run: mv web-ext-artifacts/better-intra-chrome.zip .

      - name: Collect source code
        if: env.HAS_AMO == 'true'
        run: git archive --format=zip --output=sources.zip ${{ github.ref }}

      - name: web-ext sign (Firefox)
        if: env.HAS_AMO == 'true'
        id: web-ext-sign
        uses: kewisch/action-web-ext@v2
        with:
          cmd: sign
          source: ${{ steps.web-ext-build-ff.outputs.target }}
          sourceCode: sources.zip
          channel: unlisted
          apiKey: ${{ secrets.AMO_SIGN_KEY }}
          apiSecret: ${{ secrets.AMO_SIGN_SECRET }}
          timeout: 900000

      - name: Rename signed artifact
        if: env.HAS_AMO == 'true'
        run: mv "${{ steps.web-ext-sign.outputs.target }}" better-intra.xpi

      - name: Use unsigned artifact (no AMO credentials configured)
        if: env.HAS_AMO != 'true'
        run: |
          mv "${{ steps.web-ext-build-ff.outputs.target }}" better-intra.xpi
          echo "::warning::AMO_SIGN_KEY / AMO_SIGN_SECRET not set: the Firefox .xpi is unsigned and will not auto-update."

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            better-intra.xpi
            better-intra-chrome.zip

      # Firefox auto-update: the add-on's update_url points at updates.json on
      # the main branch, so publish the new version there once the signed
      # .xpi is attached to the release.
      - name: Update updates.json (Firefox auto-update)
        if: env.HAS_AMO == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main
          git checkout main
          node scripts/update-updates-json.js "${RELEASE_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "chore: updates.json for ${RELEASE_TAG}" || exit 0
          git push origin main
